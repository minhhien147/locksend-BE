[pytest]
asyncio_mode = auto
testpaths = tests
env =
    DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/secure_file_sharing_test
    JWT_SECRET=test-secret-key-for-ci-only-do-not-use-in-prod
    JWT_ALGORITHM=HS256
    AZURE_STORAGE_ACCOUNT_NAME=test
    AZURE_STORAGE_CONTAINER_NAME=test
    AZURE_KEY_VAULT_URL=
